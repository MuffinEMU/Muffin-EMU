name: Build Showcase RPX (Homebrew)

# Builds homebrew/showcase into showcase.rpx with the standard devkitPro Wii U toolchain: the
# MuffinEMU Showcase, an original homebrew demo (3D landscape, particles, shader-style effects,
# input lab, procedural audio, stress/info) that draws on the TV and the GamePad at once.
#
# Same approach as build-rainbow-rpx.yml: a plain Linux devkitPPC container, wut's sample Makefile
# copied verbatim with our sources swapped in, no console keys and no relation to the iOS build.
#
#   push               feature/showcase-rpx only (workflow_dispatch needs the workflow on the default branch)
#   workflow_dispatch  publish=true also publishes a showcase-<sha> PRE-release with the rpx attached
#
# The five soundtrack tracks are also rendered and encoded to MP3 + M4A (encode-music job).
#
# It never touches numbered releases, tags other than showcase-<sha>, or any source file.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the RPX as a showcase-<sha> pre-release (never a numbered release)"
        type: boolean
        required: false
        default: false
  push:
    branches: [ feature/showcase-rpx ]
    paths:
      - 'homebrew/showcase/**'
      - '.github/workflows/build-showcase-rpx.yml'

concurrency:
  group: showcase-rpx-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The devkitPPC container ships no bash, so every `run:` block here is dash (`sh -e`). No
  # `pipefail`; scripts stay POSIX and use `set -eu`.
  build-showcase-rpx:
    runs-on: ubuntu-latest
    # Same pinned toolchain digest as the rainbow build.
    container: devkitpro/devkitppc@sha256:44cb1a920e1ec3ec7c06767493c3b85f8d643d6137cc4661f0201895ac6e4967
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install wut (Wii U userland toolchain)
        run: |
          set -eu
          for i in 1 2 3 4; do dkp-pacman -Sy --noconfirm wut && exit 0; echo "dkp-pacman failed (attempt $i), retrying"; sleep $((i * 20)); done
          exit 1

      - name: Clone wut (for its sample Makefile)
        run: git init -q /tmp/wut && git -C /tmp/wut fetch -q --depth 1 https://github.com/devkitPro/wut.git 0a740dccd2bc038395dacc48e701a3228f63c245 && git -C /tmp/wut checkout -q FETCH_HEAD

      - name: Assemble the project
        run: |
          set -eu
          cp -r /tmp/wut/samples/make/helloworld /tmp/showcase
          rm -f /tmp/showcase/source/*.c /tmp/showcase/source/*.cpp
          cp homebrew/showcase/source/*.c homebrew/showcase/source/*.h /tmp/showcase/source/
          ls -la /tmp/showcase/source

      - name: Build showcase.rpx
        run: |
          set -eu
          make -k -C /tmp/showcase TARGET=showcase > /tmp/showcase/build.log 2>&1 || { cat /tmp/showcase/build.log; exit 1; }
          cat /tmp/showcase/build.log
          test -f /tmp/showcase/showcase.rpx

      # A zero-byte or truncated RPX that gets uploaded and released is a failure this repo has
      # shipped before. Check the file is real here, where failing is free.
      - name: Verify the built RPX
        run: |
          set -eu
          RPX=/tmp/showcase/showcase.rpx
          SIZE=$(stat -c%s "$RPX")
          echo "showcase.rpx = $SIZE bytes"
          test "$SIZE" -gt 16384
          head -c 4 "$RPX" | od -An -tx1 | tr -d ' \n' | grep -qi '^7f454c46'
          echo "verify: PASS"

      - name: Upload showcase.rpx
        uses: actions/upload-artifact@v4
        with:
          name: showcase-rpx
          path: /tmp/showcase/showcase.rpx
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-build-log
          path: /tmp/showcase/build.log
          if-no-files-found: ignore
          retention-days: 7

  # The soundtrack as audio files. A separate plain-Ubuntu job (not the devkitPPC container): it
  # compiles tools/render_showcase_music.c against the same synth core the RPX uses
  # (source/audio_synth.c), renders each of the five tracks to 44.1 kHz stereo WAV, then encodes
  # MP3 (libmp3lame, 256 kbps CBR) and M4A (AAC, 256 kbps) with ffmpeg. 10 files in total.
  encode-music:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          set -eu
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libmp3lame; then
            sudo apt-get update -q
            sudo apt-get install -y -q ffmpeg
          fi
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E 'libmp3lame|aac'

      - name: Render the tracks to WAV
        run: |
          set -eu
          mkdir -p wav music
          cd homebrew/showcase
          cc -O2 -Wall -Wno-unused-function -I source tools/render_showcase_music.c source/audio_synth.c source/util.c -o /tmp/render_showcase_music
          /tmp/render_showcase_music "$GITHUB_WORKSPACE/wav"
          cat "$GITHUB_WORKSPACE/wav/tracks.tsv"

      - name: Encode MP3 and M4A
        run: |
          set -eu
          n=0
          while IFS="$(printf '\t')" read -r num slug name bpm; do
            wav="wav/muffinemu-showcase-$(printf %02d "$num")-$slug.wav"
            base="music/muffinemu-showcase-$(printf %02d "$num")-$slug"
            ffmpeg -hide_banner -loglevel error -y -i "$wav" -vn -c:a libmp3lame -b:a 256k -id3v2_version 3 \
              -metadata title="$name" -metadata artist="MuffinEMU" -metadata album_artist="MuffinEMU" \
              -metadata album="MuffinEMU Showcase" -metadata track="$num/5" "$base.mp3"
            ffmpeg -hide_banner -loglevel error -y -i "$wav" -vn -c:a aac -b:a 256k -movflags +faststart \
              -metadata title="$name" -metadata artist="MuffinEMU" -metadata album_artist="MuffinEMU" \
              -metadata album="MuffinEMU Showcase" -metadata track="$num/5" "$base.m4a"
            n=$((n + 1))
          done < wav/tracks.tsv
          test "$n" -eq 5

      - name: Verify the audio files
        run: |
          set -eu
          test "$(ls music/*.mp3 | wc -l)" -eq 5
          test "$(ls music/*.m4a | wc -l)" -eq 5
          for f in music/*; do
            ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bit_rate:format_tags=title,artist -of default=nw=1 "$f" | tr '\n' ' '
            echo " <- $f"
            test "$(stat -c%s "$f")" -gt 100000
            ffprobe -v error -show_entries format_tags=artist -of default=nw=1:nk=1 "$f" | grep -qx MuffinEMU
          done

      - name: Upload the audio files
        uses: actions/upload-artifact@v4
        with:
          name: showcase-music
          path: music/*
          retention-days: 30

  # Only on a manual run with publish=true: a PRE-release tagged showcase-<sha>. Its own job so
  # the build job needs no write permission.
  publish:
    needs: [build-showcase-rpx, encode-music]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the RPX
        uses: actions/download-artifact@v4
        with:
          name: showcase-rpx
          path: out
      - name: Download the audio files
        uses: actions/download-artifact@v4
        with:
          name: showcase-music
          path: out/music
      - name: Publish the pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: showcase-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: MuffinEMU Showcase (${{ github.sha }})
          prerelease: true
          make_latest: "false"
          files: |
            out/showcase.rpx
            out/music/*
          body: |
            MuffinEMU Showcase, an original Wii U homebrew demo, built from `${{ github.sha }}`.
            Not a MuffinEMU release. Copy `showcase.rpx` to the emulator's Wii U homebrew folder
            or a real console's homebrew launcher. The soundtrack is attached as 5 tracks in MP3 and M4A
            (256 kbps, 44.1 kHz stereo, by MuffinEMU). See homebrew/showcase/README.md.
