name: Build MuffinEMU (iOS)

# WHERE A BUILD GOES: THREE CHANNELS, DECIDED ONCE, NEVER INFERRED
# (details and the reasoning: docs/CI.md; the decision is ci/decide-channel.sh)
#
#   stable        numbered releases (vX.Y). Builds of main only: a push to main, or a dispatch run on
#                 main. Listed in apps.json and trollstore.json.
#   nightly       the rolling `nightly` release: the newest ELIGIBLE build of main. Eligible means the
#                 ref is refs/heads/main, the event is a push or a dispatch on main, the build and every
#                 verification succeeded, the commit is on main's first-parent history, this build is not
#                 older than the nightly already published (re-running an old build cannot move Nightly
#                 backwards), and main has not moved on to code this build lacks. Published by its own
#                 job (publish-nightly) in the `nightly` environment, which only main may deploy to.
#                 Listed in nightly.json and nightly-trollstore.json, and only if its tag is on main.
#   experimental  a workflow_dispatch on a branch other than main with channel=experimental. Published
#                 as "Experimental: <name> (<branch> @ <sha7>)" (tag experimental-<slug>-<sha7>) plus
#                 the rolling `experimental` release. Listed only in experimental.json and
#                 experimental-trollstore.json (per-experiment releases only). Never in stable or nightly.
#   everything else (pull requests, pushes to other branches, dispatches without channel=experimental,
#                 audit builds): run artifacts only. No release of any kind.
#
# Every publishing step checks the ref and the event itself as well as the channel, so a bug in the
# channel cannot publish a build to the wrong place.

#
# HOW THIS WORKFLOW KEEPS ITS SPEED WITHOUT EVER SHIPPING A STALE BINARY
# (the same explanation, with the reasoning, is in docs/CI.md)
#
# The expensive part of a build is compiling the Cemu core into Cemu.framework, about twenty
# minutes. So it is compiled once, verified, and then reused - but only ever whole, and only ever
# while nothing it is built from has changed:
#
#   * FINGERPRINT. ci/core-cache-key.sh hashes everything that can change a byte of Cemu.framework:
#     src/ minus the Swift app, the CMake files, every dependency and submodule at its pinned
#     commit, MoltenVK, the Xcode, SDK, compiler, linker and CMake versions, and every build flag.
#   * ONE CURRENT CORE. The cache holds the core built fresh and verified on main, stamped with its
#     fingerprint, as the "current core" (muffin-core-current-v1-<fingerprint>-<run>; the newest
#     such entry is the current one). A build restores it and then re-derives the fingerprint from
#     its own tree: equal means reuse, anything else means the cached core is discarded.
#   * ANYTHING ELSE IS A FULL FRESH COMPILE. A changed core, a reverted core (an older cache entry
#     that happens to match is NOT used), a new Xcode, a missing cache: clean build directory, no
#     compiler cache, no partial results. Nothing half-old is ever mixed into a binary.
#   * VERIFIED BEFORE IT COUNTS. A core only becomes current after the export gate, the stall-detector
#     tests, the app link and both IPA verifications have passed. Only a build of main promotes; a
#     pull request may compile a fresh core but never changes what is current.
#   * ESCAPE HATCH. Put [fresh-core] in a commit message, or run this workflow by hand with
#     "fresh_core" ticked: the cached core and any prebuilt IPA are ignored, everything is compiled
#     fresh, and (on main) the result is promoted as the new current core.
#
# A second, separate saving: a release is the same tree a pull request already built. When main gets
# a tree whose build id (ci/build-id.sh) matches a green run of this workflow, that run's IPAs are
# reused and only the version stamp and signature are redone (ci/package-ipas.sh), then the release
# is published as usual. No match, no reuse: it builds.
#
# The whole build, in order:
#   1. The Cemu core for arm64-ios as Cemu.framework (CMake + vcpkg), with the Swift
#      bridge and its glue compiled into it (src/CMakeLists.txt, IOS block) - or the verified
#      current core, as above.
#   2. A gate that fails the build if any function Swift can call is missing from that
#      binary - a declared-but-undefined bridge function otherwise only shows up as a
#      linker error deep inside xcodebuild. It runs on a reused core exactly as on a fresh one.
#   3. The SwiftUI app around the framework (XcodeGen + xcodebuild).
#   4. An unsigned IPA (SideStore / AltStore / LiveContainer) and an ad-hoc signed one with
#      the JIT entitlements embedded (TrollStore / jailbroken), both verified, then
#      published. A build of main is the next numbered release (see Choose the version).
#      A pull request stops after the verify: it publishes nothing, and the IPAs are
#      available as run artifacts instead.

on:
  # A manual run on main publishes the next numbered release, exactly like a push.
  # On main a dispatch is a release, exactly like a push. On any other branch it publishes NOTHING
  # unless channel is experimental (then it publishes an experimental build, see above).
  workflow_dispatch:
    inputs:
      channel:
        description: 'Off main only: "experimental" publishes an Experimental pre-release; "release" publishes the next numbered release from this branch (it must contain the latest release); anything else leaves run artifacts only'
        type: choice
        options: [ artifacts-only, experimental, release ]
        default: artifacts-only
      experiment_name:
        description: 'Experimental builds: a short name for the release title (defaults to the branch name)'
        type: string
        default: ''
      fresh_core:
        description: 'Ignore the cached core and any prebuilt IPA: compile everything fresh and, on main, promote the result as the new current core'
        type: boolean
        default: false
      point_release:
        description: 'On main only: publish a point release (7.7 -> 7.7.1, 7.7.1 -> 7.7.2) instead of the next X.Y. Does not move the next normal release: after 7.7.1 the next normal one is still 7.8'
        type: boolean
        default: false
  push:
    branches: [ main, ios27-sdk ]
    # Documentation, issue templates, bench tooling, the install-source generator and the other
    # workflows cannot change the binary. (ci/build-id.sh excludes the same set.)
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'bench/**'
      - 'homebrew/**'
      - 'dist/**'
      - 'ci/generate-sidestore-source.py'
      - '.github/workflows/build-bench-ipa.yml'
      - '.github/workflows/build-bench-rpx.yml'
      - '.github/workflows/build-rainbow-rpx.yml'
      - '.github/workflows/update-sidestore-source.yml'
      - '.github/workflows/community-stats.yml'
  # A pull request compiles the whole thing and publishes NOTHING - the three
  # release steps at the end are skipped for this event. Until this existed there
  # was no way to compile-check a change without a push to main taking the next
  # release number, or a branch build overwriting the rolling `nightly` tag that
  # the install sources point at. The IPAs still upload as run artifacts, so a
  # reviewer can install the exact build under discussion.
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'bench/**'
      - 'homebrew/**'
      - 'dist/**'
      - 'ci/generate-sidestore-source.py'
      - '.github/workflows/build-bench-ipa.yml'
      - '.github/workflows/build-bench-rpx.yml'
      - '.github/workflows/build-rainbow-rpx.yml'
      - '.github/workflows/update-sidestore-source.yml'
      - '.github/workflows/community-stats.yml'

# One build per branch: three pushes in a row should produce the newest IPA, not three. Runs on
# main are never cancelled - a release that has started finishes, and a newer push waits its turn
# (GitHub keeps one waiting run per group, and its notes cover every commit since the last release).
concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite"

jobs:
  build-app:
    # xcode-27 is the only GitHub-hosted image carrying the iOS 27.0 SDK, which is what
    # makes UISceneAccessory and registerSceneAccessory(_:) exist at compile time rather
    # than merely at runtime. Three things about it are load-bearing and were checked
    # against the image manifest before switching, not assumed:
    #   - It is arm64 only. The vcpkg binary cache below is therefore cold on the first
    #     run of this branch; that is a slow build, not a broken one.
    #   - It ships EXACTLY ONE Xcode (27.0 beta, 27A5252f) symlinked at
    #     /Applications/Xcode.app. Neither Xcode 16.4 nor Xcode_26.3.app exists on it, so
    #     the hardcoded path the app step used would have failed outright. Both steps
    #     below now pick whatever is actually installed.
    #   - It runs macOS 27.0 with CMake 4.4.3. CMake 4 drops compatibility with
    #     cmake_minimum_required below 3.5; this tree's minimums are 3.21.1 (root) and
    #     3.8 (dependencies/ih264d), both clear of that floor.
    # Note the toolchain is a BETA. That is fine for proving the SDK migration; it is a
    # separate decision whether a numbered release should ship from it.
    runs-on: xcode-27
    timeout-minutes: 330
    permissions:
      contents: write
      # Deleting the superseded current-core cache entries when a new core is promoted ("Retire the
      # superseded cores"); it was listed under `outputs:` below, so the token had no such scope and
      # `gh cache delete` answered HTTP 403. Also what reading artifacts needs if the repository is private.
      actions: write
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      tag: ${{ steps.channel.outputs.tag }}
      title: ${{ steps.channel.outputs.title }}
      short_name: ${{ steps.channel.outputs.short_name }}
    steps:
      # No submodules here: the fingerprint and the reuse lookup read only git's own records (a
      # submodule counts by the commit it pins), so a run that reuses a build never downloads
      # vcpkg. They are checked out below, by the steps that compile the core.
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Decide distribution channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_NAME: ${{ inputs.experiment_name }}
        run: ./ci/decide-channel.sh

      # The video-stall decision logic is plain C++ with no Cemu, Metal or UIKit in it, so it is tested here
      # in seconds, before the long build, with the compiler every runner already has.
      - name: Unit-test the video-stall detector
        run: |
          clang++ -std=c++17 -Wall -Wextra -I src/ios/Bridge ci/stall-detector-test.cpp -o "$RUNNER_TEMP/stall-detector-test"
          "$RUNNER_TEMP/stall-detector-test"

      - name: Select full Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Plan - is there an earlier build of this exact tree to reuse?
        # Looks for a green run of this workflow that built a tree with the same build id
        # (ci/build-id.sh: every tracked file that can change the binary, by content). If there is
        # one, its IPAs and dSYM are downloaded and everything from here to the version stamp is
        # skipped. Any doubt - no such run, expired artifacts, a build id that does not match the
        # run's own record, [fresh-core] - and this run builds.
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_core }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          BID=$(./ci/build-id.sh)
          echo "bid=$BID" >> "$GITHUB_OUTPUT"
          echo "candidate=false" >> "$GITHUB_OUTPUT"
          echo "build id: $BID"
          FRESH=false
          [ "$FORCE_DISPATCH" = "true" ] && FRESH=true
          MSGS=$(git log -1 --format=%B HEAD)
          if [ -n "$PR_HEAD_SHA" ] && git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
            MSGS="$MSGS $(git log -1 --format=%B "$PR_HEAD_SHA")"
          fi
          case "$MSGS" in *'[fresh-core]'*) FRESH=true ;; esac
          echo "fresh=$FRESH" >> "$GITHUB_OUTPUT"
          if [ "$FRESH" = true ]; then
            echo "fresh core requested: nothing is reused, everything is compiled fresh"
            exit 0
          fi
          RID=$(./ci/find-reusable-run.sh "$BID")
          if [ -z "$RID" ]; then echo "no green build of this tree: building"; exit 0; fi
          echo "candidate: run $RID"
          rm -rf prebuilt; mkdir -p prebuilt
          if ! gh run download "$RID" -R "$GITHUB_REPOSITORY" -n MuffinEMU-ipa -n MuffinEMU-dSYM -n "built-$BID" -D prebuilt; then
            echo "could not download that run's artifacts: building"; exit 0
          fi
          IPA=$(find prebuilt -name MuffinEMU.ipa | head -n1)
          DSYM=$(find prebuilt -name MuffinEMU.app.dSYM.zip | head -n1)
          META=$(find prebuilt -name meta.json | head -n1)
          if [ -z "$IPA" ] || [ -z "$DSYM" ] || [ -z "$META" ]; then echo "that run's artifacts are incomplete: building"; exit 0; fi
          if [ "$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['build_id'])" "$META")" != "$BID" ]; then
            echo "that run's own record names a different build id: building"; exit 0
          fi
          mkdir -p prebuilt/ipa
          unzip -q "$IPA" -d prebuilt/ipa
          if [ ! -d prebuilt/ipa/Payload/MuffinEMU.app ]; then echo "no app inside that IPA: building"; exit 0; fi
          {
            echo "candidate=true"
            echo "rid=$RID"
            echo "meta=$META"
            echo "dsym=$DSYM"
            echo "app=prebuilt/ipa/Payload/MuffinEMU.app"
          } >> "$GITHUB_OUTPUT"
          echo "run $RID is a candidate for reuse (see the decision below)"

      - name: Fingerprint the core
        id: fp
        run: |
          set -eo pipefail
          ./ci/core-cache-key.sh --manifest > core-manifest-now.txt
          echo "fingerprint=$(./ci/core-cache-key.sh)" >> "$GITHUB_OUTPUT"
          echo "core fingerprint: $(./ci/core-cache-key.sh)"
          cat core-manifest-now.txt | grep -v '^[0-9]\{6\} ' || true

      - name: Look up the current core
        if: steps.plan.outputs.candidate == 'true'
        id: pointer
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build-ios/out
          key: muffin-core-current-v1-none
          restore-keys: |
            muffin-core-current-v1-
          lookup-only: true

      - name: Check that the core of the candidate build can be adopted
        # A reused build compiled nothing on this run, so on main it could not promote the core it
        # brings. If the candidate run compiled a fresh core that is not yet current (a merged pull
        # request), this run adopts it - promotion without a second compile, held to the same standard:
        #  - the candidate's own record must name the fingerprint this tree has NOW: same core inputs,
        #    same toolchain. Any core input differing, or a newer Xcode since, refuses adoption;
        #  - the core's artifact must still exist (they expire after 14 days);
        #  - it is re-checked here: stamped fingerprint vs this tree, manifest, binary hash, the
        #    export gate;
        #  - it must be the very core inside the IPAs about to be published (LC_UUID equal).
        # On main a refusal means the next step decides to build instead of reuse. A pull request
        # never promotes, so it reuses regardless, but runs every check so the path is exercised early.
        if: steps.plan.outputs.candidate == 'true'
        id: adopt
        env:
          GH_TOKEN: ${{ github.token }}
          FP: ${{ steps.fp.outputs.fingerprint }}
          MATCHED: ${{ steps.pointer.outputs.cache-matched-key }}
          META: ${{ steps.plan.outputs.meta }}
          REUSED_APP: ${{ steps.plan.outputs.app }}
        run: |
          set -o pipefail
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "adopted=false" >> "$GITHUB_OUTPUT"
          refuse() { echo "::warning::core not adoptable: $1"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          CURRENT="${MATCHED#muffin-core-current-v1-}"; CURRENT="${CURRENT%%-*}"
          if [ -n "$MATCHED" ] && [ "$CURRENT" = "$FP" ]; then echo "the current core is already $FP: nothing to adopt"; exit 0; fi
          FRESH_CORE=$(python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(m['core_fresh'] and m['core_fingerprint'])" "$META")
          if [ "$FRESH_CORE" = "False" ]; then echo "the candidate reused the current core rather than compiling one: nothing to adopt"; exit 0; fi
          [ "$FRESH_CORE" = "$FP" ] || refuse "the candidate compiled core $FRESH_CORE, this tree is $FP"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cemu-core-$FP&per_page=30" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty') || true
          [ -n "$ID" ] || refuse "no unexpired artifact cemu-core-$FP"
          rm -rf build-ios/out; mkdir -p build-ios/out
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > core.zip || refuse "could not download the core artifact"
          unzip -q core.zip -d build-ios/out || refuse "the core artifact is not a zip"
          ./ci/core-cache-key.sh --verify build-ios/out || refuse "the core failed its fingerprint self-check"
          ./ci/gate-exports.sh build-ios/out/Cemu.framework || refuse "the core failed the export gate"
          uuid() { otool -l "$1" | awk '/LC_UUID/{getline; getline; print $2; exit}'; }
          [ "$(uuid build-ios/out/Cemu.framework/Cemu)" = "$(uuid "$REUSED_APP/Frameworks/Cemu.framework/Cemu")" ] \
            || refuse "the core is not the one inside the candidate's IPAs"
          echo "adopted=true" >> "$GITHUB_OUTPUT"
          echo "core $FP is verified and is the core inside the IPAs being published"

      - name: Decide - reuse the candidate build, or build
        id: go
        env:
          CANDIDATE: ${{ steps.plan.outputs.candidate }}
          ADOPT_OK: ${{ steps.adopt.outputs.ok }}
          DSYM: ${{ steps.plan.outputs.dsym }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eo pipefail
          REUSE=false
          if [ "$CANDIDATE" = true ]; then
            if [ "$ADOPT_OK" = true ] || [ "$EVENT" = pull_request ]; then
              REUSE=true
            else
              echo "the candidate's core cannot be adopted on main: building instead"
            fi
          fi
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          if [ "$REUSE" = true ]; then
            cp "$DSYM" MuffinEMU.app.dSYM.zip
            echo "app=${{ steps.plan.outputs.app }}" >> "$GITHUB_OUTPUT"
            echo "REUSING the IPAs and dSYM of run ${{ steps.plan.outputs.rid }}: nothing is compiled"
          else
            # A discarded candidate leaves nothing behind for the build to trip over.
            rm -rf prebuilt build-ios MuffinEMU.app.dSYM.zip
          fi

      - name: Restore the current core
        if: steps.go.outputs.reuse != 'true' && steps.plan.outputs.fresh != 'true'
        id: corecache
        uses: actions/cache/restore@v4
        with:
          path: build-ios/out
          # No entry is ever saved under this key. Only the prefix below matches, and a prefix
          # match returns the NEWEST entry: the current core, whichever fingerprint it carries.
          key: muffin-core-current-v1-none
          restore-keys: |
            muffin-core-current-v1-

      - name: Decide - reuse the current core, or compile a fresh one
        # The restored core is used only if it passes its own self-check: its stamped fingerprint
        # must equal the one just derived from this tree, its manifest must hash to that, and its
        # binary must be the one that was stamped. Anything else is thrown away here.
        id: core
        if: steps.go.outputs.reuse != 'true'
        env:
          FRESH: ${{ steps.plan.outputs.fresh }}
          MATCHED: ${{ steps.corecache.outputs.cache-matched-key }}
        run: |
          set -eo pipefail
          BUILD=true
          if [ "$FRESH" = true ]; then
            echo "[fresh-core]: compiling a fresh core"
          elif [ -z "$MATCHED" ]; then
            echo "no current core in the cache: compiling a fresh core"
          else
            echo "restored $MATCHED"
            if ./ci/core-cache-key.sh --verify build-ios/out; then
              BUILD=false
              echo "the current core matches this tree: REUSING it"
            else
              echo "the current core does not match this tree: discarding it, compiling a fresh core"
              rm -rf build-ios
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # ---- a fresh core: everything below runs only when the core is compiled ----
      - name: Check out the submodules
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true'
        run: |
          set -eo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --recursive

      - name: Install the core's build tools
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true'
        # ninja and cmake are preinstalled on this image. Asking for ninja anyway is idempotent and
        # keeps this working on an image that lacks it.
        run: brew install ninja

      # The control styles under Settings > On-screen Controls > Control style are a vendored
      # Swift package. Its behaviour and layout checks are plain Swift with no UIKit, so they run
      # here in seconds and fail the build before the long part on any input or layout regression.
      # The scratch path keeps the package directory free of build output for xcodegen.
      - name: TouchLab behaviour and layout checks
        run: |
          swift run --package-path src/ios/Packages/MuffinTouchLab \
            --scratch-path "$RUNNER_TEMP/touchlab-build" touchlab-check

      - name: LoadKit validation and storage checks
        run: |
          swift run --package-path src/ios/Packages/MuffinLoadKit \
            --scratch-path "$RUNNER_TEMP/loadkit-build" loadkit-check

      - name: Identify the pinned vcpkg
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true'
        id: vcpkg
        run: echo "rev=$(git -C dependencies/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Restore and save are separate so the cache is saved even when a later step fails:
      # the dependency build is the slow part, and a compile error in the core should not
      # throw it away. This is vcpkg's own binary cache of the third-party libraries - built from
      # vcpkg's ABI hash of each port, compiler and triplet, and not Cemu's code. It is the only
      # cache a fresh core compile touches, and it already existed before this workflow.
      - name: Restore vcpkg binary cache
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true'
        id: vcpkgcache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}
          restore-keys: |
            vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-

      - name: Build Cemu.framework (core + bridge) from scratch
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true'
        run: ./ci/build-core.sh

      - name: Save vcpkg binary cache
        # Only when this run had to add something: the exact entry already exists otherwise, and
        # saving it again under every pull request's ref just stored the same 130 MB dozens of times.
        if: always() && steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true' && steps.vcpkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}

      # ---- fresh or reused, the core is held to the same standard ----
      - name: Gate - every function Swift can call is in the framework
        if: steps.go.outputs.reuse != 'true'
        run: ./ci/gate-exports.sh

      - name: Stamp a fresh core with its fingerprint
        # Written next to the framework, so that it travels with it into the cache and is
        # re-checked against the tree of whoever restores it.
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true'
        run: ./ci/core-cache-key.sh --stamp build-ios/out

      - name: Upload the fresh core (so main can promote it without recompiling)
        # A pull request or a compile check on any other branch never changes what is current. When
        # that tree reaches main, the run that publishes the release adopts this exact core - after
        # re-checking it against main's own tree - instead of compiling it a second time.
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cemu-core-${{ steps.fp.outputs.fingerprint }}
          path: build-ios/out
          retention-days: 14

      # ---- the Swift app ----
      - name: xcodegen generate
        if: steps.go.outputs.reuse != 'true'
        run: |
          brew install xcodegen
          cd src/ios
          xcodegen generate

      - name: Select the newest Xcode for the app
        if: steps.go.outputs.reuse != 'true'
        # The Swift side needs at least Swift 6.2: Melo-Controller uses the optional
        # default in string interpolation ("\(gameId, default: "global")"), which Xcode
        # 16.4 rejects as an extra argument. Cemu.framework above reaches the app only
        # through the plain C bridge, so the two toolchains never share a C++ ABI
        # boundary and switching here is safe.
        #
        # Picks the newest installed Xcode instead of naming one. The old version pinned
        # /Applications/Xcode_26.3.app, which does not exist on the xcode-27 image - the
        # step would have failed before compiling a line. Sorting the installed set keeps
        # this correct on any runner image, which is the property that was missing.
        run: |
          set -eo pipefail
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          # Prefer a STABLE Xcode over a beta or release candidate of the same version.
          #
          # "Newest" alone will happily pick Xcode_27_beta_6 over a shipping Xcode 27, and
          # a build shipped from a beta toolchain is a variable nobody wants in the mix
          # when something behaves oddly on device. Betas and RCs are still used when they
          # are all that is installed - which is the case on this image today, and is how
          # the iOS 27 SDK is available at all - but the moment a stable of the same or a
          # higher version appears, it wins without anyone editing this file.
          STABLE=$(ls -d /Applications/Xcode*.app 2>/dev/null \
                   | grep -viE "beta|release_candidate|_rc" | sort -V | tail -n1)
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$STABLE" ]; then
            CHOSEN="$STABLE"
            echo "Selecting $CHOSEN (stable)"
          else
            CHOSEN="$NEWEST"
            echo "Selecting $CHOSEN - no stable Xcode on this image, so this is the only way to the iOS 27 SDK"
          fi
          sudo xcode-select -s "$CHOSEN/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          # Prove which SDK the app is actually built against - this is the whole point
          # of the migration, and it is the first thing to check if the iOS 27 code paths
          # do not appear in the binary.
          xcrun --sdk iphoneos --show-sdk-version

      # The Swift package (Melo-Controller) is pinned to a revision in project.yml, so its checkout is
      # keyed on that file. SwiftPM verifies the revision itself; this only saves the clone.
      - name: Restore the Swift package checkouts
        if: steps.go.outputs.reuse != 'true'
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: .spm
          key: muffin-spm-v1-${{ hashFiles('src/ios/project.yml') }}

      - name: Download the Metal Toolchain
        if: steps.go.outputs.reuse != 'true'
        # Xcode 26 and later ship the Metal compiler as a downloadable component rather
        # than in the base install, and the xcode-27 runner image does not include it.
        # Without this the app build reaches the Metal shader step and dies with
        # "cannot execute tool 'metal' due to missing Metal Toolchain".
        #
        # Worth noting what this failure proved: it happened at the APP's shader step,
        # which means Cemu.framework had already compiled clean on arm64, under CMake
        # 4.4.3, with an Xcode 27 beta toolchain. The risky half of this migration works.
        #
        # Retried, because this fetches from Apple's asset server and that server fails
        # often enough that one attempt is a coin flip - a build died here with "Failed
        # fetching catalog for assetType (com.apple.MobileAsset.MetalToolchain)" having
        # already spent twenty minutes compiling the core. Nothing was wrong with the
        # code either time; the network simply refused.
        run: |
          set -eo pipefail
          # Probe by RUNNING the tool, not by reading xcodebuild's prose.
          #
          # This check first asked `xcodebuild -showComponent MetalToolchain` and grepped
          # its output for "installed" - which matches "not installed" just as happily.
          # So the step announced "Metal Toolchain already installed", skipped the
          # download, exited 0, and the app build died ten minutes later on
          # "cannot execute tool 'metal'". A check that reports success when the thing is
          # absent is worse than no check at all.
          #
          # `xcrun metal --version` asks the only question that matters: can this build
          # execute the Metal compiler. There is no wording for that to get wrong.
          have_metal() { xcrun metal --version >/dev/null 2>&1; }

          if have_metal; then
            echo "Metal Toolchain already present"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            # Both halves matter: the download can report success and still leave nothing
            # runnable, which is exactly the failure above.
            if xcodebuild -downloadComponent MetalToolchain && have_metal; then
              echo "Metal Toolchain installed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Metal Toolchain download failed five times - Apple's asset server, not this repository."
              exit 1
            fi
            # Backs off rather than hammering: these outages last minutes, not seconds.
            echo "attempt $attempt failed; waiting $((attempt * 20))s"
            sleep $((attempt * 20))
          done

      - name: Build the MuffinEMU app
        if: steps.go.outputs.reuse != 'true'
        run: |
          set -eo pipefail
          cd src/ios
          xcodebuild -project MuffinEMU.xcodeproj -scheme MuffinEMU -sdk iphoneos \
            -configuration Release -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm" \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee ../../xcodebuild.log
          # The app must embed the core that was built or restored above, not some other one. LC_UUID
          # is derived from the binary's content and survives Xcode's debug-symbol strip, so two
          # different cores cannot share one.
          cd ../..
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MuffinEMU.app" -path "*Release-iphoneos*" | head -n1)
          uuid() { otool -l "$1" | awk '/LC_UUID/{getline; getline; print $2; exit}'; }
          EMBEDDED=$(uuid "$APP_PATH/Frameworks/Cemu.framework/Cemu")
          EXPECTED=$(uuid build-ios/out/Cemu.framework/Cemu)
          if [ -z "$EXPECTED" ] || [ "$EMBEDDED" != "$EXPECTED" ]; then
            echo "::error::the app embeds a core with UUID '$EMBEDDED', but the core built or restored for this run is '$EXPECTED'"
            exit 1
          fi
          echo "the app embeds the core of this run (UUID $EXPECTED)"

      - name: Save the Swift package checkouts
        if: steps.go.outputs.reuse != 'true' && steps.spm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .spm
          key: muffin-spm-v1-${{ hashFiles('src/ios/project.yml') }}

      - name: Choose the version
        env:
          MUFFIN_CHANNEL: ${{ steps.channel.outputs.channel }}
          MUFFIN_POINT: ${{ github.event_name == 'workflow_dispatch' && inputs.point_release || 'false' }}
        # A dispatch of main with point_release=true is a point release instead: the newest tag
        # (vX.Y or vX.Y.Z) plus one patch step, 7.7 -> 7.7.1 -> 7.7.2. A normal build counts vX.Y
        # tags only, so a point release never changes which X.Y comes next.
        # Every build of main is the next release: the highest vX.Y tag plus 0.1, with .9
        # rolling over to the next whole number (1.9 -> 2.0). With no numbered tag yet the
        # first release is ci/VERSION. Other branches build unnumbered test builds. A build
        # that fails or is cancelled publishes nothing, so it never uses up a number.
        run: |
          set -eo pipefail
          git fetch --tags --force -q origin
          PUBLISH=true
          # A branch dispatched with channel=release is numbered exactly like main.
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$MUFFIN_CHANNEL" = "release" ]; then
            LAST=$(git tag -l 'v*' | sed -nE 's/^v([0-9]+)\.([0-9])$/\1 \2/p' | sort -n -k1,1 -k2,2 | tail -n1)
            # The newest tag of any shape, vX.Y or vX.Y.Z, as "MAJ MIN PATCH".
            NEWEST=$(git tag -l 'v*' | sed -nE 's/^v([0-9]+)\.([0-9])(\.([0-9]+))?$/\1 \2 \4/p' | awk '{print $1, $2, ($3==""?0:$3)}' | sort -n -k1,1 -k2,2 -k3,3 | tail -n1)
            if [ "$MUFFIN_POINT" = "true" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::point_release only works on main"
              exit 1
            fi
            if [ -z "$LAST" ]; then
              if [ "$MUFFIN_POINT" = "true" ]; then echo "::error::no numbered release to patch yet"; exit 1; fi
              VER=$(./ci/version.sh)
            else
              set -- $NEWEST
              # The release we are building on top of - the range the notes describe.
              if [ "$3" = "0" ]; then PREV="v$1.$2"; else PREV="v$1.$2.$3"; fi
              if [ "$MUFFIN_POINT" = "true" ]; then
                VER="$1.$2.$(($3 + 1))"
              else
                MAJ=${LAST% *}; MIN=${LAST#* }
                MIN=$((MIN + 1))
                if [ "$MIN" -ge 10 ]; then MAJ=$((MAJ + 1)); MIN=0; fi
                VER="$MAJ.$MIN"
              fi
              # A numbered release must strictly contain the latest one. A re-run of an old build of
              # main would otherwise ship old code as the newest version.
              if ! ./ci/check-stable.sh "$PREV"; then
                if [ "$MUFFIN_CHANNEL" = "release" ]; then
                  echo "::error::$GITHUB_REF_NAME does not contain $PREV. Merge main into it before releasing from it."
                  exit 1
                fi
                PUBLISH=false
                # Not a release, so it must not claim the next number: this IPA can still be picked up
                # by the rolling build job (it decides that on its own), and an app saying "6.5" would
                # name a version no release has, one the next real build then reuses for different code.
                # Name the release it sits on instead, plus the commit in the display name.
                VER="${PREV#v}"
              fi
            fi
            TAG="v$VER"
            if [ "$PUBLISH" = true ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists"
              exit 1
            fi
            LABEL="$VER"; RELEASE=true
            [ "$PUBLISH" = true ] || LABEL="$VER+$(echo "$GITHUB_SHA" | cut -c1-7)"
          else
            VER=$(./ci/version.sh)
            TAG="auto-${GITHUB_SHA}"
            LABEL=$(echo "$GITHUB_SHA" | cut -c1-7); RELEASE=false
          fi
          echo "version $VER, tag $TAG, numbered release: $RELEASE, publish it: $PUBLISH"
          {
            echo "MUFFIN_VERSION=$VER"
            echo "MUFFIN_TAG=$TAG"
            echo "MUFFIN_LABEL=$LABEL"
            echo "MUFFIN_RELEASE=$RELEASE"
            echo "MUFFIN_PUBLISH=$PUBLISH"
            echo "MUFFIN_PREV_TAG=${PREV:-}"
          } >> "$GITHUB_ENV"

      - name: Package the IPAs (stamp, sign, zip)
        # From a fresh build, or from the app inside a reused IPA: the same script either way.
        # Stamping is an Info.plist edit on a copy, and the plist is covered by the code signature,
        # so the app is ad-hoc signed again afterwards - that is the whole difference between a
        # build and a reuse. The compiled code is never touched.
        env:
          REUSED_APP: ${{ steps.go.outputs.app }}
          REUSED_META: ${{ steps.plan.outputs.meta }}
        run: |
          set -eo pipefail
          # The launch log line (src/ios/App/CemuApp.swift) names the release and the core.
          export MUFFIN_RELEASE_COMMIT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          if [ -n "$REUSED_APP" ]; then
            export MUFFIN_CORE_FP=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['core_fingerprint'][:7])" "$REUSED_META")
          else
            export MUFFIN_CORE_FP=$(sed -n 's/^fingerprint: //p' build-ios/out/core-fingerprint.txt | cut -c1-7)
          fi
          if [ -n "$REUSED_APP" ]; then
            BASE_APP="$REUSED_APP"
          else
            BASE_APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MuffinEMU.app" -path "*Release-iphoneos*" | head -n1)
          fi
          ./ci/package-ipas.sh "$BASE_APP"

      - name: Verify the IPA is structurally sound
        run: ./ci/verify-ipa.sh MuffinEMU.ipa

      - name: Verify the ad-hoc signed IPA is structurally sound
        run: ./ci/verify-ipa.sh MuffinEMU-fakesigned.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: MuffinEMU-ipa
          path: |
            MuffinEMU.ipa
            MuffinEMU-fakesigned.ipa
          retention-days: 30

      - name: Upload dSYMs
        if: steps.go.outputs.reuse != 'true'
        run: |
          set -eo pipefail
          DSYM_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MuffinEMU.app.dSYM" -path "*Release-iphoneos*" | head -n1)
          rm -f MuffinEMU.app.dSYM.zip
          zip -qr MuffinEMU.app.dSYM.zip "$DSYM_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: MuffinEMU-dSYM
          path: MuffinEMU.app.dSYM.zip
          retention-days: 30

      - name: Record this build so a later run of the same tree can reuse it
        # Uploaded only after everything above passed, so its existence means "built and verified".
        # find-reusable-run.sh still re-checks that the run ended green.
        if: steps.go.outputs.reuse != 'true'
        env:
          BID: ${{ steps.plan.outputs.bid }}
          FP: ${{ steps.fp.outputs.fingerprint }}
          CORE_FRESH: ${{ steps.core.outputs.build }}
        run: |
          set -eo pipefail
          mkdir -p built-meta
          python3 - <<'PY'
          import json, os, re
          stamp = dict(l.split(": ", 1) for l in open("build-ios/out/core-fingerprint.txt").read().splitlines() if ": " in l)
          json.dump({
              "build_id": os.environ["BID"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "core_fingerprint": os.environ["FP"],
              "core_fresh": os.environ["CORE_FRESH"] == "true",
              "core_binary_sha256": stamp.get("binary-sha256"),
              "core_uuid": stamp.get("binary-uuid"),
          }, open("built-meta/meta.json", "w"), indent=2)
          PY
          cat built-meta/meta.json

      - name: Upload the build record
        if: steps.go.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ steps.plan.outputs.bid }}
          path: built-meta/meta.json
          retention-days: 30

      # ---- promotion: only a build of main changes which core is current ----
      - name: Promote the verified core to be the current core
        # Reached only if everything above passed: the export gate, the stall-detector tests, the
        # app link, both IPA verifications. A failure anywhere earlier means this is never run.
        if: steps.go.outputs.reuse != 'true' && steps.core.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: promote
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build-ios/out
          key: muffin-core-current-v1-${{ steps.fp.outputs.fingerprint }}-${{ github.run_id }}

      - name: Retire the superseded cores
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_KEY: muffin-core-current-v1-${{ steps.fp.outputs.fingerprint }}-${{ github.run_id }}
        run: |
          set -eo pipefail
          gh cache list -R "$GITHUB_REPOSITORY" --ref refs/heads/main --key muffin-core-current-v1- --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$NEW_KEY\") | .id" \
            | while read -r id; do gh cache delete "$id" -R "$GITHUB_REPOSITORY" || true; done

      - name: Promote the adopted core to be the current core
        if: steps.go.outputs.reuse == 'true' && steps.adopt.outputs.adopted == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: promote_adopted
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build-ios/out
          key: muffin-core-current-v1-${{ steps.fp.outputs.fingerprint }}-${{ github.run_id }}

      - name: Retire the superseded cores (after adoption)
        if: steps.promote_adopted.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_KEY: muffin-core-current-v1-${{ steps.fp.outputs.fingerprint }}-${{ github.run_id }}
        run: |
          set -eo pipefail
          gh cache list -R "$GITHUB_REPOSITORY" --ref refs/heads/main --key muffin-core-current-v1- --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$NEW_KEY\") | .id" \
            | while read -r id; do gh cache delete "$id" -R "$GITHUB_REPOSITORY" || true; done

      - name: Write the release notes
        # Notes are built from the commits in the range, so a release describes what is
        # actually in it rather than repeating the same boilerplate every time.
        #
        # A commit says its own user-facing line with a `Release-note:` trailer:
        #
        #     Run one CPU core by default
        #
        #     ...why, at length, for whoever reads the history...
        #
        #     Release-note: Games run much faster on hot devices. MuffinEMU now uses one
        #     Release-note: CPU core by default.
        #
        # That is the right moment to write it - the change is fresh and the person who
        # made it knows what it means for someone playing a game. Commits without the
        # trailer fall back to their subject line, which is honest if terse. Repeating
        # the trailer wraps one long note across lines; it does not make two bullets.
        # `Release-note: skip` leaves the commit out of the notes altogether.
        run: |
          set -eo pipefail
          # actions/checkout does not fetch notes, and a missing notes ref must not fail
          # the build - it only means nobody has written one.
          git fetch -q --force origin 'refs/notes/release-notes:refs/notes/release-notes' 2>/dev/null || true
          {
            if [ "$MUFFIN_RELEASE" = "true" ] && [ -n "$MUFFIN_PREV_TAG" ] \
               && git rev-parse -q --verify "refs/tags/$MUFFIN_PREV_TAG" >/dev/null; then
              ./ci/release-notes.sh "$MUFFIN_PREV_TAG" HEAD
            fi
            sed "s|@COMMIT@|$GITHUB_SHA|" ci/release-body.md
            if [ -n "$MUFFIN_PREV_TAG" ]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$MUFFIN_PREV_TAG" "$MUFFIN_TAG"
            fi
          } > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        # Retried, like the two network steps earlier in this file, and for the reason
        # they taught: the failure that ends a twenty-minute build is usually somebody
        # else's server having a bad second.
        #
        # This one failed with "Error saving asset" - the release itself was created and
        # then an IPA upload died partway. That leaves the worst possible state: a DRAFT
        # release carrying some of its assets, invisible to the install source (which
        # only reads published releases) and looking from the outside like the build
        # simply produced nothing. A retry re-attaches the missing files to the same
        # draft and publishes it.
        if: ((steps.channel.outputs.channel == 'main' && github.ref == 'refs/heads/main') || (steps.channel.outputs.channel == 'release' && github.event_name == 'workflow_dispatch')) && github.event_name != 'pull_request' && env.MUFFIN_PUBLISH != 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        id: publish
        continue-on-error: true
        with:
          tag_name: ${{ env.MUFFIN_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.MUFFIN_RELEASE == 'true' && format('MuffinEMU {0}', env.MUFFIN_VERSION) || format('MuffinEMU test build {0}', github.sha) }}
          prerelease: ${{ env.MUFFIN_RELEASE != 'true' }}
          make_latest: ${{ env.MUFFIN_RELEASE == 'true' }}
          # Off: the notes are written by the step above, from the commits in the
          # range. Leaving this on appended GitHub's own list of commit subjects
          # underneath, saying the same thing again in less useful words.
          generate_release_notes: false
          files: |
            MuffinEMU.ipa
            MuffinEMU-fakesigned.ipa
            MuffinEMU.app.dSYM.zip
          body_path: RELEASE_NOTES.md

      - name: Re-try publishing the release
        # Only when the first attempt failed. Same inputs, so a partial upload is
        # completed rather than duplicated - the action updates the existing draft for
        # this tag instead of creating a second release.
        #
        # No continue-on-error here, deliberately: this step failing fails the job, which
        # is what should happen when two attempts cannot publish. A draft with missing
        # assets is not installable and must not read as a green build. That also means
        # no separate guard step is needed - and a guard checking failure() would never
        # have fired anyway, because continue-on-error above keeps the job green.
        if: ((steps.channel.outputs.channel == 'main' && github.ref == 'refs/heads/main') || (steps.channel.outputs.channel == 'release' && github.event_name == 'workflow_dispatch')) && github.event_name != 'pull_request' && env.MUFFIN_PUBLISH != 'false' && steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.MUFFIN_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.MUFFIN_RELEASE == 'true' && format('MuffinEMU {0}', env.MUFFIN_VERSION) || format('MuffinEMU test build {0}', github.sha) }}
          prerelease: ${{ env.MUFFIN_RELEASE != 'true' }}
          make_latest: ${{ env.MUFFIN_RELEASE == 'true' }}
          generate_release_notes: false
          files: |
            MuffinEMU.ipa
            MuffinEMU-fakesigned.ipa
            MuffinEMU.app.dSYM.zip
          body_path: RELEASE_NOTES.md

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build-logs
          path: |
            configure.log
            build.log
            xcodebuild.log
            build-ios/vcpkg-manifest-install.log
            build-ios/**/*.log
            core-manifest-now.txt
          if-no-files-found: warn
          retention-days: 30

  # The rolling Nightly. A separate job, so the `nightly` environment's deployment-branch rule (main
  # only) is a physical barrier in front of it, in addition to this condition and the guards inside
  # ci/publish-nightly.sh. Nothing in build-app can publish nightly any more.
  publish-nightly:
    needs: build-app
    if: >-
      needs.build-app.outputs.channel == 'main' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: nightly
    permissions:
      contents: write
    # One at a time, and a waiting run is never cancelled for a newer one: ordering is decided by the
    # guards (an older build refuses to replace a newer nightly), not by who cancels whom.
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: MuffinEMU-ipa
          path: .
      - name: Publish Nightly (guarded)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          CHANNEL: ${{ needs.build-app.outputs.channel }}
        run: ./ci/publish-nightly.sh

  # An experimental build: its own "Experimental: ..." pre-release and the rolling `experimental` one.
  # Never touches nightly, a numbered release or any install source.
  publish-experimental:
    needs: build-app
    if: >-
      needs.build-app.outputs.channel == 'experimental' &&
      github.ref != 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-experimental
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: MuffinEMU-*
          merge-multiple: true
          path: .
      - name: Publish Experimental (guarded)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          CHANNEL: ${{ needs.build-app.outputs.channel }}
          TAG: ${{ needs.build-app.outputs.tag }}
          TITLE: ${{ needs.build-app.outputs.title }}
          SHORT_NAME: ${{ needs.build-app.outputs.short_name }}
        run: ./ci/publish-experimental.sh
