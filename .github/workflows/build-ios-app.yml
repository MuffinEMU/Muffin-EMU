name: Build MuffinEMU (iOS)

# The whole build, in order:
#   1. The Cemu core for arm64-ios as Cemu.framework (CMake + vcpkg), with the Swift
#      bridge and its glue compiled into it (src/CMakeLists.txt, IOS block).
#   2. A gate that fails the build if any function Swift can call is missing from that
#      binary - a declared-but-undefined bridge function otherwise only shows up as a
#      linker error deep inside xcodebuild.
#   3. The SwiftUI app around the framework (XcodeGen + xcodebuild).
#   4. An unsigned IPA (SideStore / AltStore / LiveContainer) and an ad-hoc signed one with
#      the JIT entitlements embedded (TrollStore / jailbroken), both verified, then
#      published. A build of main is the next numbered release (see Choose the version).

on:
  # A manual run on main publishes the next numbered release, exactly like a push.
  workflow_dispatch: {}
  push:
    branches: [ main ]
    # Documentation cannot change the binary.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# One build per branch: three pushes in a row should produce the newest IPA, not three.
concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite"

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select full Xcode and install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install xcodegen ninja

      - name: Identify the pinned vcpkg
        id: vcpkg
        run: echo "rev=$(git -C dependencies/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Restore and save are separate so the cache is saved even when a later step fails:
      # the dependency build is the slow part, and a compile error in the core should not
      # throw it away.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}
          restore-keys: |
            vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-

      - name: Configure the core for iOS
        # CMAKE_MACOSX_BUNDLE=OFF: for an iOS target CMake makes every executable an app
        # bundle by default, and the ZArchive submodule's zarchiveTool install rule has no
        # bundle destination, which stops configure. Cemu.framework is a library and is
        # unaffected.
        run: |
          set -eo pipefail
          mkdir -p .vcpkg-archives
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DBUILD_HEADLESS_DYLIB=ON \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}

      - name: Build Cemu.framework (core + bridge)
        run: |
          set -eo pipefail
          cmake --build build-ios --target CemuBin 2>&1 | tee build.log
          FW=$(find build-ios bin -type d -name Cemu.framework -not -path '*/CMakeFiles/*' 2>/dev/null | head -n1)
          if [ -z "$FW" ]; then echo "::error::the build finished but produced no Cemu.framework"; exit 1; fi
          rm -rf build-ios/out && mkdir -p build-ios/out
          cp -R "$FW" build-ios/out/
          file build-ios/out/Cemu.framework/Cemu

      - name: Gate - every function Swift can call is in the framework
        run: |
          set -eo pipefail
          # POSIX classes, not \s: the runner's BSD sed reads \s as a literal "s", which
          # stripped the last letter off every name ending in s (get_fps -> get_fp) and
          # reported ten exported functions as missing.
          grep -hoE '(cemu_bridge|ios_live_log)_[a-z0-9_]+[[:space:]]*\(' src/ios/Bridge/CemuBridge.h src/ios/Bridge/IOSLiveLog.h \
            | sed -E 's/[[:space:]]*\($//' | sort -u > declared.txt
          nm -gU build-ios/out/Cemu.framework/Cemu | grep -oE '_(cemu_bridge|ios_live_log)_[a-z0-9_]+$' \
            | sed 's/^_//' | sort -u > defined.txt
          MISSING=$(comm -23 declared.txt defined.txt)
          if [ -n "$MISSING" ]; then
            echo "::error::declared in the bridge headers but not exported by Cemu.framework:"
            echo "$MISSING"
            exit 1
          fi
          echo "all $(wc -l < declared.txt | tr -d ' ') bridge functions are exported"

      - name: xcodegen generate
        run: |
          cd src/ios
          xcodegen generate

      - name: Switch to Xcode 26 for the app
        # The Swift side needs Swift 6.2: Melo-Controller uses the optional default in
        # string interpolation ("\(gameId, default: "global")"), which Xcode 16.4 rejects
        # as an extra argument. Only the app build switches. Cemu.framework above is
        # already built with Xcode 16.4, and the app reaches it only through the plain C
        # bridge, so the two toolchains never share a C++ ABI boundary.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build the MuffinEMU app
        run: |
          set -eo pipefail
          cd src/ios
          xcodebuild -project MuffinEMU.xcodeproj -scheme MuffinEMU -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee ../../xcodebuild.log

      - name: Choose the version
        # Every build of main is the next release: the highest vX.Y tag plus 0.1, with .9
        # rolling over to the next whole number (1.9 -> 2.0). With no numbered tag yet the
        # first release is ci/VERSION. Other branches build unnumbered test builds. A build
        # that fails or is cancelled publishes nothing, so it never uses up a number.
        run: |
          set -eo pipefail
          git fetch --tags --force -q origin
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            LAST=$(git tag -l 'v*' | sed -nE 's/^v([0-9]+)\.([0-9])$/\1 \2/p' | sort -n -k1,1 -k2,2 | tail -n1)
            if [ -z "$LAST" ]; then
              VER=$(./ci/version.sh)
            else
              MAJ=${LAST% *}; MIN=${LAST#* }
              MIN=$((MIN + 1))
              if [ "$MIN" -ge 10 ]; then MAJ=$((MAJ + 1)); MIN=0; fi
              VER="$MAJ.$MIN"
            fi
            TAG="v$VER"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists"
              exit 1
            fi
            LABEL="$VER"; RELEASE=true
          else
            VER=$(./ci/version.sh)
            TAG="auto-${GITHUB_SHA}"
            LABEL=$(echo "$GITHUB_SHA" | cut -c1-7); RELEASE=false
          fi
          echo "version $VER, tag $TAG, numbered release: $RELEASE"
          {
            echo "MUFFIN_VERSION=$VER"
            echo "MUFFIN_TAG=$TAG"
            echo "MUFFIN_LABEL=$LABEL"
            echo "MUFFIN_RELEASE=$RELEASE"
          } >> "$GITHUB_ENV"

      - name: Stamp the build name and version
        # LiveContainer and SideStore tell builds apart by name and version.
        # CFBundleIdentifier is not touched: it keys the app's data container.
        run: |
          set -eo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MuffinEMU.app" -path "*Release-iphoneos*" | head -n1)
          PL="$APP_PATH/Info.plist"
          pb() { /usr/libexec/PlistBuddy "$@"; }
          pb -c "Set :CFBundleDisplayName MuffinEMU $MUFFIN_LABEL" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleDisplayName string MuffinEMU $MUFFIN_LABEL" "$PL"
          pb -c "Set :CFBundleShortVersionString $MUFFIN_VERSION" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleShortVersionString string $MUFFIN_VERSION" "$PL"
          pb -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$PL"
          echo "stamped display name: $(pb -c 'Print :CFBundleDisplayName' "$PL")"
          echo "stamped version:      $(pb -c 'Print :CFBundleShortVersionString' "$PL")"
          ls "$APP_PATH/Frameworks"

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MuffinEMU.app" -path "*Release-iphoneos*" | head -n1)
          rm -rf Payload MuffinEMU.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MuffinEMU.ipa Payload
          echo "IPA size: $(du -h MuffinEMU.ipa | cut -f1)"

      - name: Package ad-hoc signed IPA (TrollStore / jailbroken)
        # The plain IPA carries no entitlements at all; entitlements only exist inside a
        # signature. This variant embeds them for install paths that do not re-sign.
        # Frameworks are signed first: a signed app with unsigned embedded frameworks does
        # not load on those install paths.
        run: |
          set -eo pipefail
          rm -rf PayloadSigned MuffinEMU-fakesigned.ipa iparoot
          cp -R Payload PayloadSigned
          for fw in PayloadSigned/MuffinEMU.app/Frameworks/*.framework; do
            codesign -f -s - "$fw"
          done
          codesign -f -s - \
            --entitlements src/ios/Cemu.entitlements \
            --generate-entitlement-der \
            PayloadSigned/MuffinEMU.app
          COUNT=$(codesign -d --entitlements - --xml PayloadSigned/MuffinEMU.app 2>/dev/null \
            | python3 -c "import sys,plistlib; d=sys.stdin.buffer.read(); i=d.find(b'<?xml'); print(0 if i<0 else len(plistlib.loads(d[i:])))")
          echo "embedded entitlements: $COUNT"
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::ad-hoc signing embedded $COUNT entitlements, expected at least 4"
            exit 1
          fi
          mkdir -p iparoot/Payload
          cp -R PayloadSigned/MuffinEMU.app iparoot/Payload/
          ( cd iparoot && zip -qry ../MuffinEMU-fakesigned.ipa Payload )
          echo "fake-signed IPA size: $(du -h MuffinEMU-fakesigned.ipa | cut -f1)"

      - name: Verify the IPA is structurally sound
        run: ./ci/verify-ipa.sh MuffinEMU.ipa

      - name: Verify the ad-hoc signed IPA is structurally sound
        run: ./ci/verify-ipa.sh MuffinEMU-fakesigned.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: MuffinEMU-ipa
          path: |
            MuffinEMU.ipa
            MuffinEMU-fakesigned.ipa
          retention-days: 30

      - name: Upload dSYMs
        run: |
          set -eo pipefail
          DSYM_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MuffinEMU.app.dSYM" -path "*Release-iphoneos*" | head -n1)
          zip -qr MuffinEMU.app.dSYM.zip "$DSYM_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: MuffinEMU-dSYM
          path: MuffinEMU.app.dSYM.zip
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MUFFIN_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.MUFFIN_RELEASE == 'true' && format('MuffinEMU {0}', env.MUFFIN_VERSION) || format('MuffinEMU test build {0}', github.sha) }}
          prerelease: ${{ env.MUFFIN_RELEASE != 'true' }}
          make_latest: ${{ env.MUFFIN_RELEASE == 'true' }}
          generate_release_notes: true
          files: |
            MuffinEMU.ipa
            MuffinEMU-fakesigned.ipa
            MuffinEMU.app.dSYM.zip
          body: |
            MuffinEMU, Wii U emulation for iPhone and iPad, built from commit ${{ github.sha }}.

            **`MuffinEMU.ipa`** - SideStore / AltStore / LiveContainer. Unsigned; they re-sign
            with your own Apple ID at install.

            **`MuffinEMU-fakesigned.ipa`** - TrollStore or jailbroken only, with the JIT
            entitlements embedded.

            The recompiler needs a JIT enabler (StikJIT, SideStore, LiveContainer) and the
            "Use the recompiler (JIT)" switch in Settings; without both it runs the
            interpreter. `MuffinEMU.app.dSYM.zip` is only needed to symbolicate a crash report.

            MuffinEMU is built on Cemu. Some MeloCafe cores and bug fixes have been brought over to MuffinEMU.

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build-logs
          path: |
            configure.log
            build.log
            xcodebuild.log
            build-ios/vcpkg-manifest-install.log
            build-ios/**/*.log
          if-no-files-found: warn
          retention-days: 30
