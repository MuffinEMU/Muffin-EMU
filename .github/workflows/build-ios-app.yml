name: Build iOS App (M2)

# M2: build the actual Xcode app, linking against the CMake-built CemuCafe/iosgui/
# vcpkg static libs (see src/ios/project.yml + ci/generate-link-flags.sh) instead of
# recompiling ~500 C++ files a second time inside Xcode's own build system, which has
# no dependency-provisioning story of its own.
#
# Manual dispatch only for now — this is new, unverified ground, unlike
# build-ios-core.yml which is our steady-state regression check.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Optional. Publish the IPA as a GitHub Release under this tag (e.g. v2.0).
          Leave empty to only upload artifacts, which is the normal case.
        required: false
        default: ''
  # Every push to the working branch builds and publishes an installable IPA by itself.
  #
  # WHY: until now a fix only reached the device when somebody remembered to dispatch a
  # build and then hand over a link, which put a human step between "fixed" and
  # "installable" and made the wait depend on whether anyone was awake. The release is the
  # delivery mechanism rather than the artifact, because an artifact needs a GitHub login
  # to download and the device doing the installing does not have one.
  push:
    branches:
      - ios-audio-and-renderscale
      # v1.37 base carrying the CPU fixes and the timebase overflow fix. Its own tag so
      # it cannot be confused with the lines that render nothing.
      - ios-v137-base
      # v1.38's renderer restored wholesale, with only the CPU and JIT work carried
      # forward. Its own branch so it builds and releases without touching either of
      # the other lines.
      - ios-v138-renderer-restore
    # Documentation cannot change the binary, and a 20-minute build for a comment edit is
    # 20 minutes of runner nobody gets back.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# One build per branch. Pushing three commits in a row should produce the newest IPA, not
# three queued builds delivering two stale ones first.
concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-app:
    runs-on: macos-15
    permissions:
      contents: write # only used by the optional release step at the bottom
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select full Xcode and install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install xcodegen

      - name: Enable vcpkg GHA binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cross-compile dependencies for arm64-ios
        run: |
          "$HOME/vcpkg/vcpkg" install --triplet arm64-ios \
            --x-manifest-root="$GITHUB_WORKSPACE"

      - name: Configure Cemu core for iOS
        run: |
          set -eo pipefail
          cmake -B build-ios -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ios.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Build all static libs the app needs
        # CemuCafe links clean on its own (it's a static lib - target_link_libraries
        # dependencies aren't required to physically exist until something actually
        # links them into a final binary), but CemuAudio in particular is never a
        # build prerequisite of CemuCafe/iosgui - it's normally only linked into the
        # desktop CemuBin executable. Build every relevant library explicitly so the
        # Xcode app (which needs the real merged binary) has them all as .a files.
        run: |
          set -eo pipefail
          cmake --build build-ios --target \
            CemuCafe iosgui CemuAudio CemuComponents CemuCommon CemuConfig \
            imguiImpl CemuInput CemuResource CemuUtil \
            2>&1 | tee build.log

      - name: xcodegen generate
        run: |
          cd src/ios
          xcodegen generate

      - name: Build the Cemu iOS app
        run: |
          set -eo pipefail
          cd src/ios
          xcodebuild -project Cemu-iOS.xcodeproj -scheme Cemu -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee ../../xcodebuild.log

      - name: Stamp a distinguishable build name and version
        # WHY: every build shipped as CFBundleName "Cemu" with CFBundleShortVersionString
        # 0.1.0, so in LiveContainer and SideStore every version ever installed looked
        # identical and Void could not tell which build was which. That is what he meant
        # by LiveContainer being "very unorganized" - it was our packaging, not his setup.
        # Verified by unzipping the SHIPPED v38 IPA and reading its Info.plist, not by
        # reading the project files.
        #
        # CFBundleIdentifier is deliberately NOT changed. It keys the app's data container,
        # so changing it would orphan his saves and mlc directory - a far worse problem than
        # ambiguous names.
        run: |
          set -eo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Cemu.app" -path "*Release-iphoneos*" | head -n1)
          PL="$APP_PATH/Info.plist"
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}-$(echo "$GITHUB_SHA" | cut -c1-7)"; fi
          # The tag carries a flat build number (v47-blob-fix -> 47). Shipping that
          # verbatim as CFBundleShortVersionString made the app report its version as
          # "47", which reads like a mature product on its forty-seventh major release
          # rather than pre-1.0 software that does not reliably play games yet.
          #
          # Split it into major.minor instead: 47 -> 4.7, 48 -> 4.8, 50 -> 5.0, and it
          # keeps working past 100 (122 -> 12.2). The TAG keeps the flat number, which is
          # what makes it unambiguous and correctly sortable; only the displayed version
          # is derived. ci/generate-sidestore-source.py derives the same string the same
          # way, so the app and the source feed never disagree about what a build is
          # called.
          # The version comes from the VERSION file, never from arithmetic on the
          # tag. Deriving it from the tag number broke three times: v47 stamped
          # itself "47", the dotted-tag fix landed in Python but not in this shell
          # so v4.8 stamped "0.4", and a three-digit tag like v138 is genuinely
          # ambiguous (13.8 by the arithmetic, 1.38 in fact). See ci/version.sh.
          VER=$(./ci/version.sh)
          # A dotted tag must agree with VERSION, or the release would advertise a
          # number the binary inside it does not report - which is how v4.9 came to
          # ship an IPA three commits older than its own tag with every step green.
          TAGVER=$(echo "$TAG" | sed -nE 's/^v?([0-9]+\.[0-9]+).*/\1/p')
          if [ -n "$TAGVER" ] && [ "$TAGVER" != "$VER" ]; then
            echo "::error::Tag $TAG says version $TAGVER but VERSION says $VER."
            echo "::error::Bump VERSION (the rule is +0.1 per release) or retag."
            exit 1
          fi
          # Home-screen label. Must be SHORT and must not contain a slash: an icon caption
          # gets a handful of characters, and a branch name like feat/foo-v2 both overflows
          # and truncates mid-word. Tested against real tag and branch inputs rather than
          # assumed - "Muffin 38-geometry-rect" was the first attempt and it was unusable.
          if echo "$TAG" | grep -qE '^v?[0-9]+'; then
            LABEL="$VER"
          else
            LABEL="$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          pb() { /usr/libexec/PlistBuddy "$@"; }
          pb -c "Set :CFBundleDisplayName Muffin $LABEL" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleDisplayName string Muffin $LABEL" "$PL"
          pb -c "Set :CFBundleShortVersionString $VER" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleShortVersionString string $VER" "$PL"
          pb -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$PL"
          echo "stamped display name: $(pb -c 'Print :CFBundleDisplayName' "$PL")"
          echo "stamped version:      $(pb -c 'Print :CFBundleShortVersionString' "$PL")"

      - name: Package unsigned IPA
        # SideStore/AltStore re-sign with the user's own Apple ID at install time, so
        # an unsigned .app (CODE_SIGNING_ALLOWED=NO above) is enough - it just needs
        # the standard Payload/<Name>.app zip layout an IPA installer expects.
        run: |
          set -eo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Cemu.app" -path "*Release-iphoneos*" | head -n1)
          echo "Found app at: $APP_PATH"
          # Start from nothing: cp -R into an existing Payload/ merges rather than
          # replaces, so a stale directory would silently ship alongside the new one.
          rm -rf Payload Cemu.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Cemu.ipa Payload
          echo "IPA size: $(du -h Cemu.ipa | cut -f1)"

      - name: Package ad-hoc signed IPA (TrollStore / jailbroken)
        # The plain IPA above is UNSIGNED, which means it carries no entitlements at
        # all - entitlements only exist inside a code signature. src/ios/Cemu.entitlements
        # declares dynamic-codesigning and com.apple.security.cs.allow-jit, and on an
        # unsigned build not one of them reaches the binary. That is fine for
        # SideStore/AltStore, which re-sign with the user's own Apple ID at install and
        # would strip those entitlements anyway, but it means the recompiler can never
        # get MAP_JIT on an install path that does not re-sign.
        #
        # So: a second, ad-hoc signed variant with the entitlements genuinely embedded,
        # for TrollStore and jailbroken devices where signature validation is relaxed.
        # This was being done by hand after each release and was therefore forgotten on
        # some of them; doing it here means the two variants can never drift apart again.
        #
        # --generate-entitlement-der is required: iOS 15+ reads the DER form, and a
        # signature carrying only the XML form is treated as having no entitlements.
        run: |
          set -eo pipefail
          rm -rf PayloadSigned Cemu-fakesigned.ipa
          cp -R Payload PayloadSigned
          codesign -f -s - \
            --entitlements src/ios/Cemu.entitlements \
            --generate-entitlement-der \
            PayloadSigned/Cemu.app
          # Gate, not a report. A "fake-signed" build whose entitlements silently failed
          # to embed is worse than no build at all - it looks like the JIT variant and
          # behaves like the plain one, which is exactly the confusion this exists to
          # prevent. Read them back out and fail the build if they are not there.
          COUNT=$(codesign -d --entitlements - --xml PayloadSigned/Cemu.app 2>/dev/null \
            | python3 -c "import sys,plistlib; d=sys.stdin.buffer.read(); i=d.find(b'<?xml'); print(0 if i<0 else len(plistlib.loads(d[i:])))")
          echo "embedded entitlements: $COUNT"
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::ad-hoc signing embedded $COUNT entitlements, expected at least 4"
            exit 1
          fi
          # An IPA must contain a top-level directory literally named Payload, so the
          # signed .app is copied into a fresh one rather than zipping PayloadSigned.
          rm -rf iparoot && mkdir -p iparoot/Payload
          cp -R PayloadSigned/Cemu.app iparoot/Payload/
          ( cd iparoot && zip -qry ../Cemu-fakesigned.ipa Payload )
          echo "fake-signed IPA size: $(du -h Cemu-fakesigned.ipa | cut -f1)"

      - name: Verify the IPA is structurally sound
        # Gate, not a report: this runs before any upload or release step, so a
        # malformed IPA fails the build instead of becoming a download.
        #
        # The check that matters most is the last one - it hands the packaged bundle
        # to a real NSBundle and fails if the identifier or CFBundleExecutable comes
        # back nil. That is the exact failure v1.14 and v1.15 shipped with: a bundle
        # whose files were all present and correct, but which CFBundle could not read
        # because a directory named `resources` at the top level collided
        # case-insensitively with the reserved `Resources`. Every otool-level check
        # here passed on those builds. Only asking CFBundle catches it.
        run: ./ci/verify-ipa.sh Cemu.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-unsigned-ipa
          path: Cemu.ipa
          retention-days: 30

      - name: Upload dSYM
        # Needed to symbolicate any on-device crash report (raw addresses -> real
        # function names/lines) - Xcode already generates one alongside the .app,
        # this just surfaces it as a downloadable artifact.
        run: |
          set -eo pipefail
          DSYM_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Cemu.app.dSYM" -path "*Release-iphoneos*" | head -n1)
          echo "Found dSYM at: $DSYM_PATH"
          zip -r Cemu.app.dSYM.zip "$DSYM_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: Cemu-dSYM
          path: Cemu.app.dSYM.zip
          retention-days: 30

      - name: Refuse to publish into a tag that names different code
        # Gate, not a report. v4.9 shipped an IPA three commits older than its own tag:
        # the release was created by hand at 3b0f0ee0 while this workflow was already
        # building 04d33d14, and the release step below happily uploaded the older
        # binary into the already-existing tag. The tag therefore claimed the
        # version-reporting fix (3b0f0ee0) and the TrollStore variant (7f9391df) while
        # the installable binary contained neither - so the app reported the wrong
        # version and no TrollStore build existed, both of which the tag implied were
        # fixed. That is the same "newest release is not the newest code" trap log.md
        # already records for v40-icon-matched-themes, arriving by a different route:
        # there the branch was stale, here the tag moved on while the build was running.
        #
        # Uploading into a tag that points somewhere other than the commit in this
        # binary makes the release lie about its own contents, so fail before anything
        # is uploaded rather than after someone installs it. A tag that does not exist
        # yet is fine - the release step creates it at this exact commit.
        if: inputs.release_tag != '' || github.event_name == 'push'
        run: |
          set -eo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            echo "No explicit tag - the release step generates one from this commit, so it cannot disagree."
            exit 0
          fi
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ]; then
            echo "Tag $TAG does not exist yet; it will be created at $GITHUB_SHA."
            exit 0
          fi
          if [ "$EXISTING" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already points at $EXISTING, but this binary was built from $GITHUB_SHA."
            echo "::error::Publishing would attach this build to a tag that names different code - exactly how v4.9 shipped without its own version fix."
            echo "::error::Either dispatch this workflow against $EXISTING, or use a new tag for the current commit."
            exit 1
          fi
          echo "Tag $TAG already exists and points at this build ($GITHUB_SHA)."

      - name: Publish GitHub Release
        # Opt-in, because most dispatches of this workflow are verification runs, not
        # things worth installing. The artifacts above are the normal delivery path;
        # a Release exists so an IPA can be fetched on the device itself without
        # being signed into GitHub, which is what actually matters for SideStore.
        #
        # This replaces build-and-release.yml and build-ipa.yml, both deleted in the
        # same commit: both built a "CemuEmulator" project/scheme that has not
        # existed in this repo for a long time, so both failed within ~20 seconds of
        # every dispatch. Only this workflow builds the CMake static libs the app
        # actually links against, so only this workflow can produce a real IPA.
        # A manual dispatch publishes under the tag it was given; a push publishes under
        # a generated one. Named by date and short sha rather than by an incrementing
        # number because nothing here can safely invent a version, and a name that says
        # WHEN and WHICH COMMIT is the thing you actually need when comparing two logs.
        if: inputs.release_tag != '' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || (github.ref_name == 'ios-v137-base' && format('v137-{0}', github.sha) || (github.ref_name == 'ios-v138-renderer-restore' && format('v138r-{0}', github.sha) || format('auto-{0}', github.sha))) }}
          name: ${{ inputs.release_tag != '' && inputs.release_tag || (github.ref_name == 'ios-v137-base' && format('v1.37 + clock fix {0}', github.sha) || (github.ref_name == 'ios-v138-renderer-restore' && format('v1.38 renderer restored {0}', github.sha) || format('Automatic build {0}', github.sha))) }}
          generate_release_notes: true
          files: |
            Cemu.ipa
            Cemu-fakesigned.ipa
            Cemu.app.dSYM.zip
          body: |
            Unsigned iOS build from commit ${{ github.sha }}.

            **`Cemu.ipa`** - SideStore / AltStore / LiveContainer. Unsigned; they
            re-sign with your own Apple ID at install.

            **`Cemu-fakesigned.ipa`** - TrollStore or jailbroken only. Ad-hoc signed
            with the JIT entitlements (`dynamic-codesigning`, `allow-jit`) genuinely
            embedded, which a SideStore re-sign would strip. Use this one if you want
            the recompiler to be able to get executable memory.

            `Cemu.app.dSYM.zip` is only needed to symbolicate a crash report.

            Built from `${{ github.ref_name }}`.

            Check the `Init Cemu <sha>` line at the top of the log before judging a
            build — it names the commit that is actually in the binary, and it is the
            only reliable way to tell one build from another.

            See `STATUS.md` for what does and does not work.

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build-logs
          path: |
            configure.log
            build.log
            xcodebuild.log
            build-ios/**/*.log
          if-no-files-found: warn
          retention-days: 30
