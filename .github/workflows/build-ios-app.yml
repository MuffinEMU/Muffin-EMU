name: Build MuffinEMU (iOS)

# The whole build, in order:
#   1. MeloCafe's Cemu core for arm64-ios as Cemu.framework (CMake + vcpkg), with Muffin's
#      Swift bridge and its glue compiled into it (src/CMakeLists.txt, IOS block).
#   2. A gate that fails the build if any function Swift can call is missing from that
#      binary - a declared-but-undefined bridge function otherwise only shows up as a
#      linker error deep inside xcodebuild.
#   3. Muffin's SwiftUI app around the framework (XcodeGen + xcodebuild).
#   4. An unsigned IPA (SideStore / AltStore / LiveContainer) and an ad-hoc signed one with
#      the JIT entitlements embedded (TrollStore / jailbroken), both verified, then
#      published.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Optional. Publish the IPA as a GitHub Release under this tag (e.g. v1.0).
          Leave empty to publish an automatic pre-release named after the commit.
        required: false
        default: ''
  push:
    branches: [ main ]
    # Documentation cannot change the binary.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# One build per branch: three pushes in a row should produce the newest IPA, not three.
concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite"

jobs:
  build-app:
    runs-on: macos-15
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select full Xcode and install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install xcodegen ninja

      - name: Identify the pinned vcpkg
        id: vcpkg
        run: echo "rev=$(git -C dependencies/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Restore and save are separate so the cache is saved even when a later step fails:
      # the dependency build is the slow part, and a compile error in the core should not
      # throw it away.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}
          restore-keys: |
            vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-

      - name: Configure MeloCafe core for iOS
        # CMAKE_MACOSX_BUNDLE=OFF: for an iOS target CMake makes every executable an app
        # bundle by default, and the ZArchive submodule's zarchiveTool install rule has no
        # bundle destination, which stops configure. Cemu.framework is a library and is
        # unaffected.
        run: |
          set -eo pipefail
          mkdir -p .vcpkg-archives
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DBUILD_HEADLESS_DYLIB=ON \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}

      - name: Build Cemu.framework (MeloCafe core + Muffin bridge)
        run: |
          set -eo pipefail
          cmake --build build-ios --target CemuBin 2>&1 | tee build.log
          FW=$(find build-ios bin -type d -name Cemu.framework -not -path '*/CMakeFiles/*' 2>/dev/null | head -n1)
          if [ -z "$FW" ]; then echo "::error::the build finished but produced no Cemu.framework"; exit 1; fi
          rm -rf build-ios/out && mkdir -p build-ios/out
          cp -R "$FW" build-ios/out/
          file build-ios/out/Cemu.framework/Cemu

      - name: Gate - every function Swift can call is in the framework
        run: |
          set -eo pipefail
          # POSIX classes, not \s: the runner's BSD sed reads \s as a literal "s", which
          # stripped the last letter off every name ending in s (get_fps -> get_fp) and
          # reported ten exported functions as missing.
          grep -hoE '(cemu_bridge|ios_live_log)_[a-z0-9_]+[[:space:]]*\(' src/ios/Bridge/CemuBridge.h src/ios/Bridge/IOSLiveLog.h \
            | sed -E 's/[[:space:]]*\($//' | sort -u > declared.txt
          nm -gU build-ios/out/Cemu.framework/Cemu | grep -oE '_(cemu_bridge|ios_live_log)_[a-z0-9_]+$' \
            | sed 's/^_//' | sort -u > defined.txt
          MISSING=$(comm -23 declared.txt defined.txt)
          if [ -n "$MISSING" ]; then
            echo "::error::declared in the bridge headers but not exported by Cemu.framework:"
            echo "$MISSING"
            exit 1
          fi
          echo "all $(wc -l < declared.txt | tr -d ' ') bridge functions are exported"

      - name: xcodegen generate
        run: |
          cd src/ios
          xcodegen generate

      - name: Build the MuffinEMU app
        run: |
          set -eo pipefail
          cd src/ios
          xcodebuild -project Cemu-iOS.xcodeproj -scheme Cemu -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee ../../xcodebuild.log

      - name: Stamp a distinguishable build name and version
        # Every build otherwise installs under the same name and version, and LiveContainer
        # and SideStore cannot tell two of them apart. CFBundleIdentifier is not touched:
        # it keys the app's data container.
        run: |
          set -eo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Cemu.app" -path "*Release-iphoneos*" | head -n1)
          PL="$APP_PATH/Info.plist"
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}-$(echo "$GITHUB_SHA" | cut -c1-7)"; fi
          VER=$(./ci/version.sh)
          # A dotted tag must agree with VERSION, or the release advertises a number the
          # binary inside it does not report.
          TAGVER=$(echo "$TAG" | sed -nE 's/^v?([0-9]+\.[0-9]+).*/\1/p')
          if [ -n "$TAGVER" ] && [ "$TAGVER" != "$VER" ]; then
            echo "::error::Tag $TAG says version $TAGVER but ci/VERSION says $VER."
            exit 1
          fi
          # Home-screen label: short, no slashes.
          if echo "$TAG" | grep -qE '^v?[0-9]+'; then
            LABEL="$VER"
          else
            LABEL="$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          pb() { /usr/libexec/PlistBuddy "$@"; }
          pb -c "Set :CFBundleDisplayName MuffinEMU $LABEL" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleDisplayName string MuffinEMU $LABEL" "$PL"
          pb -c "Set :CFBundleShortVersionString $VER" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleShortVersionString string $VER" "$PL"
          pb -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PL" 2>/dev/null \
            || pb -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$PL"
          echo "stamped display name: $(pb -c 'Print :CFBundleDisplayName' "$PL")"
          echo "stamped version:      $(pb -c 'Print :CFBundleShortVersionString' "$PL")"
          ls "$APP_PATH/Frameworks"

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Cemu.app" -path "*Release-iphoneos*" | head -n1)
          rm -rf Payload Cemu.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Cemu.ipa Payload
          echo "IPA size: $(du -h Cemu.ipa | cut -f1)"

      - name: Package ad-hoc signed IPA (TrollStore / jailbroken)
        # The plain IPA carries no entitlements at all; entitlements only exist inside a
        # signature. This variant embeds them for install paths that do not re-sign.
        # Frameworks are signed first: a signed app with unsigned embedded frameworks does
        # not load on those install paths.
        run: |
          set -eo pipefail
          rm -rf PayloadSigned Cemu-fakesigned.ipa iparoot
          cp -R Payload PayloadSigned
          for fw in PayloadSigned/Cemu.app/Frameworks/*.framework; do
            codesign -f -s - "$fw"
          done
          codesign -f -s - \
            --entitlements src/ios/Cemu.entitlements \
            --generate-entitlement-der \
            PayloadSigned/Cemu.app
          COUNT=$(codesign -d --entitlements - --xml PayloadSigned/Cemu.app 2>/dev/null \
            | python3 -c "import sys,plistlib; d=sys.stdin.buffer.read(); i=d.find(b'<?xml'); print(0 if i<0 else len(plistlib.loads(d[i:])))")
          echo "embedded entitlements: $COUNT"
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::ad-hoc signing embedded $COUNT entitlements, expected at least 4"
            exit 1
          fi
          mkdir -p iparoot/Payload
          cp -R PayloadSigned/Cemu.app iparoot/Payload/
          ( cd iparoot && zip -qry ../Cemu-fakesigned.ipa Payload )
          echo "fake-signed IPA size: $(du -h Cemu-fakesigned.ipa | cut -f1)"

      - name: Verify the IPA is structurally sound
        run: ./ci/verify-ipa.sh Cemu.ipa

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: MuffinEMU-ipa
          path: |
            Cemu.ipa
            Cemu-fakesigned.ipa
          retention-days: 30

      - name: Upload dSYMs
        run: |
          set -eo pipefail
          DSYM_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Cemu.app.dSYM" -path "*Release-iphoneos*" | head -n1)
          zip -qr Cemu.app.dSYM.zip "$DSYM_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: MuffinEMU-dSYM
          path: Cemu.app.dSYM.zip
          retention-days: 30

      - name: Refuse to publish into a tag that names different code
        if: inputs.release_tag != ''
        run: |
          set -eo pipefail
          TAG="${{ inputs.release_tag }}"
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "$GITHUB_SHA" ]; then exit 0; fi
          echo "::error::Tag $TAG already points at $EXISTING, but this binary was built from $GITHUB_SHA."
          exit 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('auto-{0}', github.sha) }}
          name: ${{ inputs.release_tag != '' && format('MuffinEMU {0}', inputs.release_tag) || format('MuffinEMU build {0}', github.sha) }}
          prerelease: ${{ inputs.release_tag == '' }}
          generate_release_notes: true
          files: |
            Cemu.ipa
            Cemu-fakesigned.ipa
            Cemu.app.dSYM.zip
          body: |
            MuffinEMU from commit ${{ github.sha }}: the Muffin app running MeloCafe's Cemu core.

            **`Cemu.ipa`** - SideStore / AltStore / LiveContainer. Unsigned; they re-sign
            with your own Apple ID at install.

            **`Cemu-fakesigned.ipa`** - TrollStore or jailbroken only, with the JIT
            entitlements embedded.

            The recompiler needs a JIT enabler (StikJIT, SideStore, LiveContainer) and the
            "Use the recompiler (JIT)" switch in Settings; without both it runs the
            interpreter. `Cemu.app.dSYM.zip` is only needed to symbolicate a crash report.

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build-logs
          path: |
            configure.log
            build.log
            xcodebuild.log
            build-ios/vcpkg-manifest-install.log
            build-ios/**/*.log
          if-no-files-found: warn
          retention-days: 30
