name: Update SideStore source

# Regenerates docs/apps.json from the repository's real releases and commits it to
# main, so the source feed cannot drift from what is actually downloadable. Without
# this, every release would need someone to remember to hand-edit a JSON file - and
# a source that advertises a build nobody can install is worse than no source.

on:
  # The load-bearing trigger. A release published by CI's GITHUB_TOKEN does NOT raise
  # the `release` event - GitHub suppresses it so a workflow cannot trigger itself in a
  # loop - so `release` alone never fires for our own builds.
  #
  # That was hidden for a while by accident: hand-editing a release's notes under a
  # personal token DOES raise `release: edited`, so every release whose notes were
  # rewritten by hand happened to refresh the source. The moment the notes became
  # automatic, nothing edited them, nothing fired, and v4.2 shipped with the source
  # still advertising v4.1 - a feed pointing at a build that is no longer the newest.
  #
  # workflow_run is not suppressed the same way: it keys off a workflow FINISHING, not
  # off who holds the token.
  workflow_run:
    workflows: ["Build MuffinEMU (iOS)"]
    types: [completed]
  # Kept for a release edited or deleted by a human, which this should also follow.
  release:
    types: [published, edited, deleted]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sidestore-source
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # A failed or cancelled build published nothing, so there is nothing new to point at
    # and regenerating would only rewrite the file with what it already says.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate docs/apps.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/generate-sidestore-source.py --repo "$GITHUB_REPOSITORY" --out-dir docs

      - name: Verify it is valid and non-empty
        # A malformed or empty source silently breaks installs for everyone who added
        # it, so this is a gate before committing, not a report afterwards.
        run: |
          python3 - <<'PY'
          import json,glob,sys
          files=sorted(glob.glob("docs/*.json"))
          assert files, "no source feeds produced"
          for f in files:
              d=json.load(open(f)); app=d["apps"][0]
              assert app["versions"], f"{f}: no versions"
              for v in app["versions"]:
                  for k in ("version","date","downloadURL","size"):
                      assert v.get(k) is not None, f"{f}: version missing {k}"
                  assert v["downloadURL"].startswith("https://"), f"{f}: non-https downloadURL"
              print(f"ok: {f} - {len(app['versions'])} versions, newest v{app['versions'][0]['version']}")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/*.json; then
            echo "source already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.json
          git commit -m "Update install sources for $GITHUB_REF_NAME"
          git push
