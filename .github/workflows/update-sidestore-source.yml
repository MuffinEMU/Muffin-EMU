name: Update SideStore source

# Regenerates the install-source JSON in docs/ from the repository's releases and
# commits it to main, so the feeds always match what can actually be downloaded.

on:
  # Runs after every build. A release published with CI's GITHUB_TOKEN does not raise
  # the `release` event (GitHub suppresses it to prevent loops), so `workflow_run` is
  # what keeps the feeds current for our own builds.
  workflow_run:
    workflows: ["Build MuffinEMU (iOS)"]
    types: [completed]
  # Kept for a release edited or deleted by a human, which this should also follow.
  release:
    types: [published, edited, deleted]
  workflow_dispatch: {}

permissions:
  contents: write

# Never cancel a run that is already regenerating: every completion of the build workflow (a pull
# request's, a cancelled one, one whose job below is skipped) starts a run of THIS workflow that joins
# the group before `if:` is evaluated, so with cancel-in-progress a pull request build finishing
# seconds after main's would cancel the run that was about to commit main's new release, and its own
# job would be skipped: no update at all. The generator is idempotent, so running in turn is safe.
concurrency:
  group: sidestore-source
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # A cancelled build published nothing, so there is nothing new to point at and regenerating
    # would only rewrite the file with what it already says. A FAILED run of main or of a dispatch
    # may still have published its numbered release (the build job succeeded, a later job such as
    # publish-nightly failed), and the run's overall conclusion is then "failure": regenerating is
    # idempotent, so it is done for those too. A failed pull request run published nothing.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate docs/apps.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/generate-sidestore-source.py --repo "$GITHUB_REPOSITORY" --out-dir docs

      - name: Verify it is valid and non-empty
        # A malformed or empty source silently breaks installs for everyone who added
        # it, so this is a gate before committing, not a report afterwards.
        run: |
          python3 - <<'PY'
          import json,glob,sys
          files=sorted(glob.glob("docs/*.json"))
          assert files, "no source feeds produced"
          for f in files:
              d=json.load(open(f)); app=d["apps"][0]
              # Channel separation, re-checked on the files themselves (the generator also refuses).
              text=open(f).read()
              name=f.split("/")[-1]
              if name.startswith("experimental"):
                  assert "/releases/download/nightly/" not in text, f"{f}: experimental feed mentions nightly"
                  assert "/releases/download/experimental/" not in text, f"{f}: experimental feed mentions the rolling release"
              else:
                  assert "/experimental" not in text, f"{f}: a stable or nightly feed mentions an experimental URL"
              assert app["versions"], f"{f}: no versions"
              for v in app["versions"]:
                  for k in ("version","date","downloadURL","size"):
                      assert v.get(k) is not None, f"{f}: version missing {k}"
                  assert v["downloadURL"].startswith("https://"), f"{f}: non-https downloadURL"
              print(f"ok: {f} - {len(app['versions'])} versions, newest v{app['versions'][0]['version']}")
          PY

      - name: Commit if changed
        run: |
          # -A so that a feed the generator removed (no live experiments) is removed here too.
          git add -A -- 'docs/*.json'
          if git diff --cached --quiet; then
            echo "source already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update install sources for $GITHUB_REF_NAME"
          # main may have moved since checkout (a new build, another feed run), so
          # rebase onto it and retry rather than fail on a non-fast-forward push.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 3))
          done
          echo "could not push the updated source" >&2
          exit 1
