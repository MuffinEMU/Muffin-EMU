name: Bug report
description: Something in MuffinEMU is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [troubleshooting guide](https://muffinemu.github.io/MuffinEMU/docs/troubleshooting.html) and the open issues first. One problem per report.
  - type: input
    id: version
    attributes:
      label: MuffinEMU version
      description: Shown in Settings › About, e.g. 5.2.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPad Pro 12.9" (2020), iOS 26.6.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - SideStore
        - AltStore
        - LiveContainer
        - TrollStore
        - Jailbroken
        - Other
    validations:
      required: true
  - type: dropdown
    id: cpu
    attributes:
      label: CPU mode
      description: Settings shows which one the current launch is using.
      options:
        - Interpreter
        - Recompiler (JIT)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Metal
        - Vulkan (MoltenVK 1.4.3)
        - Vulkan (MoltenVK 1.2.8)
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Title and region, if the problem is specific to a game.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Launch log
      description: Turn on Settings › Diagnostics › Show launch log, reproduce the problem, and paste the log here. Crash reports are welcome too.
      render: text
