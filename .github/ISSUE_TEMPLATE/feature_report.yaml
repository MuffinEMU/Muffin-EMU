name: Feature request
description: Suggest something MuffinEMU should do.
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like MuffinEMU to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What this would let you do that you can't today.
