name: Cemu-iOS

options:
  bundleIdPrefix: com.kiddreads
  deploymentTarget:
    iOS: '15.0'
  xcodeVersion: '15.0'

settings:
  PRODUCT_NAME: Cemu
  # Its own identifier, so MuffinEMU installs next to Muffin instead of over it: a
  # different identifier is a different app container, and Muffin's library, keys and
  # saves stay exactly where they are.
  PRODUCT_BUNDLE_IDENTIFIER: com.kiddreads.MuffinEMU
  SDKROOT: iphoneos
  IPHONEOS_DEPLOYMENT_TARGET: '15.0'
  CODE_SIGN_IDENTITY: iPhone Developer
  # See Cemu.entitlements. Only the ad-hoc signed IPA actually carries these.
  CODE_SIGN_ENTITLEMENTS: Cemu.entitlements
  SWIFT_OBJC_BRIDGING_HEADER: Bridge/Cemu-Bridging-Header.h
  CLANG_ENABLE_MODULES: 'YES'
  # The whole engine - MeloCafe's Cemu core with CemuBridge.mm and its glue compiled into
  # it - arrives as one framework, built by CMake before this project is generated (see
  # .github/workflows/build-ios-app.yml). This target compiles Swift and nothing else, so
  # it needs no engine headers, no prefix header and no list of static libraries: the
  # bridging header is plain C and lives in Bridge/.
  HEADER_SEARCH_PATHS:
    - '$(SRCROOT)/Bridge'
  FRAMEWORK_SEARCH_PATHS:
    - '$(SRCROOT)/../../build-ios/out'
  LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
  GENERATE_INFOPLIST_FILE: 'YES'
  # CFBundleIcons/CFBundleAlternateIcons and the file-sharing keys are nested or were
  # dropped by the generated plist, so they live in this partial plist and are merged in.
  INFOPLIST_FILE: 'Info-AlternateIcons.plist'
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'AltIcon-dark AltIcon-happy AltIcon-retro AltIcon-mint-matcha AltIcon-blueberry-blast AltIcon-strawberry AltIcon-double-chocolate AltIcon-lemon-zest AltIcon-neon-cyber AltIcon-pumpkin-spice AltIcon-holiday-frost AltIcon-spooky-halloween AltIcon-rainbow-pride AltIcon-summer-beach AltIcon-galaxy-space AltIcon-progress-pride AltIcon-transgender-pride AltIcon-equality AltIcon-fix-the-world AltIcon-autism-awareness AltIcon-adhd-awareness AltIcon-audhd-awareness AltIcon-disability-pride AltIcon-mental-health-pride AltIcon-lesbian-pride AltIcon-bisexual-pride AltIcon-nonbinary-pride AltIcon-pro-gold-vip AltIcon-pro-holographic AltIcon-pro-diamond-ice'
  MARKETING_VERSION: '1.0'
  CURRENT_PROJECT_VERSION: '1'
  INFOPLIST_KEY_CFBundleDisplayName: MuffinEMU
  INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
  INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  INFOPLIST_KEY_GCSupportsControllerUserInteraction: 'YES'
  INFOPLIST_KEY_UIStatusBarHidden: 'YES'
  # MeloCafe's core opens the microphone when a title asks for GamePad microphone input.
  # Without a usage string iOS terminates the app at that moment instead of asking.
  INFOPLIST_KEY_NSMicrophoneUsageDescription: 'MuffinEMU uses the microphone only when a Wii U game asks for GamePad microphone input.'

targets:
  Cemu:
    type: application
    platform: iOS
    deploymentTarget: '15.0'

    sources:
      - path: App
        type: group
      - path: Emulation
        type: group
      - path: Rendering
        type: group
      - path: Bridge
        type: group
        # Headers only. The .mm and .cpp files are compiled into Cemu.framework by CMake;
        # compiling them here too would need the whole engine include environment again.
        excludes:
          - '*.mm'
          - '*.cpp'
          - 'Core/**'
      - path: Resources
        type: group

    dependencies:
      - framework: ../../build-ios/out/Cemu.framework
        embed: true
      # Two MoltenVK builds for the Vulkan renderer, embedded and deliberately not linked:
      # the bridge picks one per launch (Settings > Graphics > MoltenVK) and the core loads
      # only that one. Linking either would load it at launch next to the other.
      - framework: ../../dependencies/MoltenVK.xcframework
        embed: true
        link: false
      - framework: ../../dependencies/MoltenVK128.framework
        embed: true
        link: false

    # Cemu's own data files (bin/resources/sharedFonts, bin/gameProfiles), copied into
    # Cemu.app/CemuData - the data path cemu_bridge_initialize() hands the core. A copy
    # step after the build, because the bundle does not exist before it.
    postBuildScripts:
      - name: Copy Cemu data files (shared fonts, game profiles) into the bundle
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../../ci/copy-bundle-data.sh"

    scheme:
      gatherCoverageData: false
