# GitHub Pages builds this folder with Jekyll. The site's own pages are plain HTML
# with no front matter, so Jekyll copies them as they are; these settings only reach
# the Markdown files here, which GitHub Pages also turns into pages.
title: MuffinEMU
description: MuffinEMU is a free, open-source Wii U emulator for iPhone and iPad, based on Cemu.

# Developer notes rather than player docs: still reachable, but kept out of search
# results (see _includes/head-custom.html). GAMEPAD_LAYOUT.md repeats the browsable
# gamepad-layout page.
defaults:
  - scope:
      path: "AUDIT.md"
    values:
      noindex: true
  - scope:
      path: "CI.md"
    values:
      noindex: true
  - scope:
      path: "gamepad-layout/GAMEPAD_LAYOUT.md"
    values:
      noindex: true
